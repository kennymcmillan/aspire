title: Aspire
author: Kenny McMillan (Aspire Academy)
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    html:
      theme: [cosmo, aspire.scss]
      include-after-body: aspire-footer.html
      embed-resources: true
      toc: true
      toc-location: left
      toc-depth: 2
      smooth-scroll: true
      anchor-sections: true
      code-fold: true
      code-tools: true
      fig-width: 10
      fig-height: 5
      df-print: paged
